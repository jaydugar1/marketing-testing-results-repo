<style>
:root{

  --radius-md:8px;--radius-lg:12px;--radius-full:9999px;
  --shadow-sm:0 1px 3px rgba(49,30,4,0.08),0 1px 2px rgba(49,30,4,0.04);
  --shadow-md:0 4px 12px rgba(49,30,4,0.10),0 2px 4px rgba(49,30,4,0.06);
  --shadow-xl:0 16px 48px rgba(49,30,4,0.15),0 8px 16px rgba(49,30,4,0.10);
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-body);color:var(--color-espresso);background:#fff;}
h1,h2,h3,h4,h5{font-family:var(--font-headline);color:var(--color-green);margin:0;}
h6{font-family:var(--font-body);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-green);margin:0;}
button{font-family:var(--font-body);}
.chip{font-size:.875rem;font-weight:500;padding:6px 14px;border-radius:var(--radius-full);border:1px solid var(--neutral-300);background:#fff;color:var(--color-espresso-mid);cursor:pointer;}
.chip.active{border-color:var(--color-green);background:var(--color-green);color:var(--color-cream);}
.seg{padding:7px 16px;border-radius:6px;border:none;font-size:.875rem;font-weight:500;cursor:pointer;background:transparent;color:var(--color-espresso-mid);}
.seg.active{background:#fff;color:var(--color-green);box-shadow:var(--shadow-sm);}
.tab{padding:14px 20px;border:none;border-bottom:3px solid transparent;background:transparent;font-family:var(--font-headline);font-size:.875rem;font-weight:500;color:var(--color-espresso-mid);cursor:pointer;white-space:nowrap;}
.tab.active{border-bottom-color:var(--color-green);color:var(--color-green);font-weight:700;}
.badge{font-size:.75rem;font-weight:500;background:var(--color-cream);color:var(--color-espresso);padding:3px 10px;border-radius:var(--radius-full);white-space:nowrap;}
.badge-true{font-size:.75rem;font-weight:600;background:var(--color-green);color:var(--color-cream);padding:4px 10px;border-radius:var(--radius-full);white-space:nowrap;}
.badge-dir{font-size:.75rem;font-weight:600;background:#fff;color:var(--color-espresso);border:1px solid var(--neutral-400);padding:3px 10px;border-radius:var(--radius-full);white-space:nowrap;}
.card{background:#fff;border:1px solid var(--neutral-200);border-radius:var(--radius-lg);padding:20px;cursor:pointer;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s,border-color .15s;}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--color-green);}
input[type=text],input[type=number]{padding:9px 12px;border:1px solid var(--neutral-300);border-radius:var(--radius-md);font-family:var(--font-body);font-size:.9rem;background:var(--neutral-100);color:var(--color-espresso);}
table{width:100%;border-collapse:collapse;font-size:.75rem;}
th{text-align:left;padding:8px 10px;background:var(--color-cream);color:var(--color-espresso);font-weight:600;border-bottom:1px solid var(--neutral-300);white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--neutral-200);color:var(--color-espresso-mid);white-space:nowrap;}
.stat-tile{background:var(--color-green-dark);border-radius:var(--radius-lg);padding:16px 24px;min-width:140px;}
.overlay-bg{position:fixed;inset:0;background:rgba(49,30,4,.35);z-index:30;}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);background:#fff;z-index:31;box-shadow:var(--shadow-xl);overflow-y:auto;padding:32px;}
.report-bg{position:fixed;inset:0;background:rgba(49,30,4,.45);z-index:40;}
.report-panel{position:fixed;top:24px;left:50%;transform:translateX(-50%);width:816px;max-width:94vw;max-height:92vh;overflow-y:auto;background:#fff;z-index:41;box-shadow:var(--shadow-xl);border-radius:var(--radius-lg);padding:56px;}
.close-x{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;border:1px solid var(--neutral-300);background:#fff;color:var(--color-espresso);font-size:1.1rem;cursor:pointer;line-height:1;}
@media print{
  .no-print{display:none !important;}
  body.report-printing .app-body{display:none !important;}
  body.report-printing .report-panel{position:static !important;box-shadow:none !important;width:100% !important;max-width:100% !important;max-height:none !important;transform:none !important;margin:0 !important;}
}
</style>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildDetailBlocks(t){
  const blocks=[];
  const heading=h=>blocks.push({k:'h',v:h});
  const text=s=>{ if(s) blocks.push({k:'t',v:s}); };
  const statGrid=arr=>{ if(arr&&arr.length) blocks.push({k:'s',v:arr}); };
  const list=arr=>{ if(arr&&arr.length) blocks.push({k:'l',v:arr}); };
  const table=tbl=>{ if(tbl&&tbl.headers) blocks.push({k:'tb',headers:tbl.headers,rows:tbl.rows}); };

  text(t.summary);
  if(t.headline){ heading('Headline'); text(t.headline); }
  if(t.headlineMetrics){ heading('Key Metrics'); statGrid(t.headlineMetrics); }
  if(t.significanceTest){
    heading('Significance Test'+(t.significanceTest.type?' — '+t.significanceTest.type:''));
    const st=t.significanceTest;
    statGrid(Object.keys(st).filter(k=>k!=='type').map(k=>({label:k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()),value:st[k]})));
  }
  if(t.table){ heading('Detailed Results'); table(t.table); }
  if(t.variants){
    heading('Variants');
    t.variants.forEach(v=>{
      text('<strong>'+esc(v.name||'')+(v.message?': "'+esc(v.message)+'"':'')+'</strong>');
      const stats=[];
      if(v.mailersSent) stats.push({label:'Mailers Sent',value:v.mailersSent.toLocaleString()});
      if(v.members) stats.push({label:'Members',value:v.members.toLocaleString()});
      if(v.firstCalls) stats.push({label:'First Calls',value:v.firstCalls});
      if(v.newCases) stats.push({label:'New Cases',value:v.newCases});
      if(v.callRate) stats.push({label:'Call Rate',value:v.callRate});
      if(v.caseRate) stats.push({label:'Case Rate',value:v.caseRate});
      if(v.liftVsHoldout) stats.push({label:'Lift vs. Holdout',value:v.liftVsHoldout});
      if(v.callToCase) stats.push({label:'Call to Case',value:v.callToCase});
      if(v.caseToConsult) stats.push({label:'Case to Consult',value:v.caseToConsult});
      if(v.consultToProcedure) stats.push({label:'Consult to Procedure',value:v.consultToProcedure});
      statGrid(stats);
    });
  }
  if(t.segments){
    heading('Segments');
    t.segments.forEach(s=>{
      text('<strong>'+esc(s.name)+'</strong> — Call rate '+esc(s.callRate)+'. '+esc(s.detail||''));
      const stats=[];
      if(s.costOfLetter) stats.push({label:'Cost of Letter',value:s.costOfLetter});
      if(s.revenueDriven) stats.push({label:'Revenue Driven',value:s.revenueDriven});
      statGrid(stats);
      if(s.recommendation) text(s.recommendation);
    });
  }
  if(t.internalSends){ heading('Lantern Internal Sends'); statGrid(t.internalSends.map(x=>({label:x.name,value:x.lift,detail:x.change}))); }
  if(t.externalSends){ heading('M-DCPS External Sends'); statGrid(t.externalSends.map(x=>({label:x.name,value:x.lift,detail:x.change}))); }
  if(t.clientBreakdown){ heading('Client Breakdown'); statGrid(t.clientBreakdown.map(c=>({label:c.client,value:c.count!=null?c.count.toLocaleString():'—'}))); }
  if(t.whyThisMailerMatters){ heading('Why This Mailer Matters'); list(t.whyThisMailerMatters.map(w=>w.title+' — '+w.detail)); }
  if(t.whySpouseShareMatters){ heading('Why the Spouse Share Signal Matters'); list(t.whySpouseShareMatters); }
  if(t.keyTakeaways){ heading('Key Takeaways'); list(t.keyTakeaways); }
  if(t.caveats){ heading('Caveats'); list(t.caveats); }
  if(t.analysis){ heading('Analysis'); text(t.analysis); }
  if(t.recommendation){ heading('Recommendation'); text(t.recommendation); }
  if(t.results){ heading('Results'); text(t.results); }
  if(t.bottomLine){ heading('Bottom Line'); text(t.bottomLine); }
  if(t.methodology){ heading('Methodology'); text(t.methodology); }
  if(t.notes){ heading('Notes'); text(typeof t.notes==='string'?t.notes:JSON.stringify(t.notes)); }
  if(t.logCrossRef){ heading('Historical Log Cross-Reference'); text(t.logCrossRef); }
  return blocks;
}

function typeBadge(t){
  return t.testTypeCategory==='true-test'
    ? '<span class="badge-true">True Test</span>'

function toneMark(t){
  const color = t.tone==='positive'?'var(--color-green)':t.tone==='negative'?'var(--color-espresso-mid)':'var(--neutral-500)';
  const mark = t.tone==='positive'?'↑':t.tone==='negative'?'↓':'↔';

function renderBlock(b){
  if(b.k==='h') return '<h6 style="margin:0 0 10px;">'+esc(b.v)+'</h6>';
  if(b.k==='t') return '<p style="margin:0;color:var(--color-espresso-mid);font-size:.9rem;line-height:1.65;">'+b.v+'</p>';
  if(b.k==='l') return '<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;">'+b.v.map(li=>'<li style="font-size:.9rem;color:var(--color-espresso-mid);line-height:1.65;">'+esc(li)+'</li>').join('')+'</ul>';
  if(b.k==='s') return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;">'+b.v.map(s=>
    '<div style="background:var(--color-cream);border-radius:8px;padding:12px 14px;">'+
      '<div style="font-family:var(--font-headline);font-size:1.25rem;font-weight:700;color:var(--color-green);line-height:1.1;">'+esc(s.value)+'</div>'+
      '<div style="font-size:.75rem;color:var(--color-espresso-mid);margin-top:4px;font-weight:500;">'+esc(s.label)+'</div>'+
      (s.detail?'<div style="font-size:.75rem;color:var(--neutral-500);margin-top:2px;">'+esc(s.detail)+'</div>':'')+
    '</div>').join('')+'</div>';
  if(b.k==='tb') return '<div style="overflow-x:auto;border:1px solid var(--neutral-200);border-radius:8px;"><table><thead><tr>'+
    b.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+
    b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  return '';
}

function computeCalc(t, ee){
  if(!t.impactAvailable || !(ee>0)) return null;
  return t.impactMetrics.map(m=>{
    const controlCount = Math.round((m.controlPct/100)*ee);
    const testCount = Math.round((m.testPct/100)*ee);
    const delta = testCount - controlCount;
    return { label:m.label, controlLabel:m.controlLabel, testLabel:m.testLabel, controlPct:m.controlPct, testPct:m.testPct,
      controlCountLabel:controlCount.toLocaleString(), testCountLabel:testCount.toLocaleString(),
      deltaLabel:(delta>=0?'+':'')+delta.toLocaleString() };
  });
}

        '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:16px;border-bottom:2px solid var(--color-green);padding-bottom:8px;">'+
        '<h2>'+esc(g.label)+'</h2><span style="font-size:.875rem;color:var(--neutral-500);">'+g.tests.length+(g.tests.length===1?' test':' tests')+'</span></div>'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;">'+
        g.tests.map(t=>
          '<div class="card" data-action="open" data-val="'+esc(t.id)+'">'+
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'+
          '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+channelBadges(t)+'</div>'+typeBadge(t)+
          '</div>'+
          '<h4 style="line-height:1.3;">'+esc(t.name)+'</h4>'+
          '<div style="display:flex;align-items:baseline;gap:6px;">'+toneMark(t)+'<span style="font-size:.875rem;color:var(--color-espresso-mid);line-height:1.3;">'+esc(t.cardStat)+'</span></div>'+
          (t.flagged?'<div style="font-size:.75rem;color:var(--color-espresso-mid);background:var(--neutral-100);border:1px dashed var(--neutral-400);border-radius:6px;padding:6px 10px;">⚑ Needs review — '+esc(t.flagReason)+'</div>':'')+
          '</div>'
        ).join('')+
        '</div></div>';
    });
  }
  html += '</div>';
  html += '</div>'; // end app-body

  if(activeTest){
    html += '<div class="no-print overlay-bg" data-action="closepanel"></div>';
    html += '<div class="no-print panel">'+
      '<button class="close-x" data-action="closepanel">×</button>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-right:48px;">'+channelBadges(activeTest)+typeBadge(activeTest)+
      '<span class="badge" style="background:var(--neutral-100);">'+esc(activeTest.quarterBucket)+'</span></div>'+
      '<h2 style="margin-bottom:20px;padding-right:48px;">'+esc(activeTest.name)+'</h2>'+
      (activeTest.flagged?'<div style="font-size:.875rem;color:var(--color-espresso-mid);background:var(--neutral-100);border:1px dashed var(--neutral-400);border-radius:8px;padding:12px 16px;margin-bottom:20px;">⚑ Needs review — '+esc(activeTest.flagReason)+'</div>':'')+
      buildDetailBlocks(activeTest).map(b=>'<div style="margin-bottom:24px;">'+renderBlock(b)+'</div>').join('');

    if(activeTest.impactAvailable){
      html += '<div style="margin:8px 0 0;padding:20px;background:var(--color-cream);border-radius:12px;">'+
        '<h6 style="margin:0 0 4px;">Estimate Impact For A Client</h6>'+
        '<p style="margin:0 0 14px;font-size:.875rem;color:var(--color-espresso-mid);">Project how this test\'s control vs. test rates would play out for a specific client\'s population.</p>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">'+
        '<input id="clientNameInput" type="text" placeholder="Client name (optional)" value="'+esc(state.calcClientName)+'" style="flex:1;min-width:160px;">'+
        '<input id="eeCountInput" type="number" min="1" placeholder="EE count" value="'+esc(state.calcEECount)+'" style="width:140px;">'+
        '</div>';
      if(calcResults){
        html += '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">'+
          calcResults.map(r=>'<div style="background:#fff;border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">'+
            '<div><div style="font-size:.875rem;font-weight:600;color:var(--color-espresso);">'+esc(r.label)+'</div>'+
            '<div style="font-size:.75rem;color:var(--neutral-500);">'+esc(r.controlLabel)+': '+r.controlCountLabel+' ('+r.controlPct+'%) · '+esc(r.testLabel)+': '+r.testCountLabel+' ('+r.testPct+'%)</div></div>'+
            '<div style="font-family:var(--font-headline);font-size:1.25rem;font-weight:700;color:var(--color-green);white-space:nowrap;">'+r.deltaLabel+'</div></div>').join('')+
          '</div><button id="genReportBtn" style="padding:10px 18px;border-radius:8px;border:none;background:var(--color-green);color:var(--color-cream);font-weight:600;font-size:.875rem;cursor:pointer;">Generate PDF Report</button>';
      }
      html += '</div>';
    } else {
      html += '<div style="margin-top:8px;padding:16px 20px;background:var(--neutral-100);border-radius:12px;font-size:.875rem;color:var(--neutral-500);">Impact calculator not available for this test — '+esc(activeTest.impactUnavailableReason)+'</div>';
    }
    html += '</div>';
  }

  if(state.showReport && activeTest && calcResults){
    const clientLabel = state.calcClientName.trim() || 'Unnamed Client';
    html += '<div class="no-print report-bg" data-action="closereport"></div>';
    html += '<div class="report-panel">'+
      '<button class="no-print close-x" data-action="closereport">×</button>'+
      '<div style="font-family:var(--font-headline);font-size:.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-green);">Client Impact Projection</div>'+
      '<h1 style="margin:8px 0 4px;font-size:1.9rem;">'+esc(activeTest.name)+'</h1>'+
      '<p style="margin:0 0 28px;color:var(--color-espresso-mid);">Prepared for '+esc(clientLabel)+' · '+Math.round(ee).toLocaleString()+' covered lives</p>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:28px;">'+
      calcResults.map(m=>'<div style="background:var(--color-cream);border-radius:12px;padding:18px;">'+
        '<div style="font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--color-espresso-mid);">'+esc(m.label)+'</div>'+
        '<div style="font-family:var(--font-headline);font-size:2.2rem;font-weight:800;color:var(--color-green);line-height:1;margin-top:6px;">'+m.deltaLabel+'</div>'+
        '<div style="font-size:.875rem;color:var(--color-espresso-mid);margin-top:8px;">'+esc(m.controlLabel)+': '+m.controlCountLabel+' ('+m.controlPct+'%) → '+esc(m.testLabel)+': '+m.testCountLabel+' ('+m.testPct+'%)</div></div>').join('')+
      '</div>'+
      '<div style="background:var(--color-cream);border-radius:12px;padding:18px 20px;margin-bottom:28px;">'+
      '<div style="font-size:.75rem;font-weight:600;text-transform:uppercase;color:var(--color-espresso-mid);margin-bottom:6px;">Methodology</div>'+
      '<p style="margin:0;font-size:.875rem;color:var(--color-espresso-mid);line-height:1.65;">Projection applies the observed control and test rates from this test to the supplied covered-life count. Actual results for a specific client population may vary based on demographics, benefit design, and communication history.</p></div>'+
      '<button id="printReportBtn" class="no-print" style="padding:12px 22px;border-radius:8px;border:none;background:var(--color-green);color:var(--color-cream);font-weight:600;font-size:1rem;cursor:pointer;">Print / Save as PDF</button>'+
      '<div style="margin-top:32px;padding-top:16px;border-top:1px solid var(--neutral-200);font-size:.75rem;color:var(--neutral-500);">Confidential and Proprietary — Lantern Marketing Testing Steering Committee</div>'+
      '</div>';
  }

  app.innerHTML = html;
  wireEvents();
}

function wireEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', e=>{
      const action = el.dataset.action, val = el.dataset.val;
      if(action==='channel'){ state.selectedChannel = val; render(); }
      else if(action==='testtype'){ state.testTypeFilter = val; render(); }
      else if(action==='quarter'){ const i=state.selectedQuarters.indexOf(val); if(i>=0) state.selectedQuarters.splice(i,1); else state.selectedQuarters.push(val); render(); }
      else if(action==='open'){ state.openTestId = val; state.calcClientName=''; state.calcEECount=''; state.showReport=false; render(); }
      else if(action==='closepanel'){ state.openTestId = null; state.calcClientName=''; state.calcEECount=''; state.showReport=false; render(); }
      else if(action==='closereport'){ state.showReport = false; render(); }
    });
  });
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', e=>{ state.search = e.target.value; render(); searchInput.focus(); searchInput.setSelectionRange(state.search.length, state.search.length); });
  }
  const printBtn = document.getElementById('printBtn');
  if(printBtn) printBtn.addEventListener('click', ()=>window.print());
  const clientNameInput = document.getElementById('clientNameInput');
  if(clientNameInput){
    clientNameInput.addEventListener('input', e=>{ state.calcClientName = e.target.value; render();
      const el = document.getElementById('clientNameInput'); if(el){ el.focus(); el.setSelectionRange(state.calcClientName.length, state.calcClientName.length); } });
  }
  const eeCountInput = document.getElementById('eeCountInput');
  if(eeCountInput){
    eeCountInput.addEventListener('input', e=>{ state.calcEECount = e.target.value; render();
      const el = document.getElementById('eeCountInput'); if(el){ el.focus(); } });
  }
  const genReportBtn = document.getElementById('genReportBtn');
  if(genReportBtn) genReportBtn.addEventListener('click', ()=>{ state.showReport = true; render(); });
  const printReportBtn = document.getElementById('printReportBtn');
  if(printReportBtn) printReportBtn.addEventListener('click', ()=>{ document.body.classList.add('report-printing'); setTimeout(()=>window.print(),50); });
  window.addEventListener('afterprint', ()=>document.body.classList.remove('report-printing'), {once:false});
}

render();
</script>
</body>
</html>
